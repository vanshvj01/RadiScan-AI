[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radiscan"
version = "2.1.0"
description = "Uncertainty-aware, explainable deep learning for chest radiograph interpretation"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
authors = [{ name = "Vansh Vijayvargiya" }]

dependencies = [
  "torch>=2.1",
  "torchvision>=0.16",
  "timm>=1.0.7",
  "numpy>=1.24,<2.2",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "opencv-python-headless>=4.8",
  "albumentations>=1.4",
  "pydicom>=2.4",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "PyYAML>=6.0",
  "tqdm>=4.66",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "python-multipart>=0.0.9",
  "python-jose[cryptography]>=3.3",
  "bcrypt>=4.1",
  "celery>=5.4",
  "redis>=5.0",
  "psycopg2-binary>=2.9",
  "reportlab>=4.1",
  "prometheus-fastapi-instrumentator>=7.0",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.5",
  "black>=24.4",
  "mypy>=1.10",
]

[project.scripts]
radiscan-train = "radiscan.cli.train:main"
radiscan-eval = "radiscan.cli.evaluate:main"
radiscan-predict = "radiscan.cli.predict:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "SIM"]
ignore = ["E501", "B008"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The `services` package lives at the repo root, not under src/, so it is not
# covered by the editable install. Without this, bare `pytest` cannot import it
# (only `python -m pytest` works, because that puts CWD on sys.path) and the
# whole API suite errors with ModuleNotFoundError. Resolved relative to rootdir,
# so it works from any working directory.
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
  "slow: end-to-end tests that train or serve (deselect with '-m \"not slow\"')",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
